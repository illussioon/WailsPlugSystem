<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>WailsPlugSystem IP Demo</title>
    <style>
      :root {
        color-scheme: light dark;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #0f172a;
        color: #e2e8f0;
      }
      main {
        width: min(680px, calc(100% - 48px));
        padding: 42px;
        border: 1px solid #334155;
        border-radius: 24px;
        background: linear-gradient(145deg, #1e293b, #111827);
        box-shadow: 0 24px 80px rgba(0, 0, 0, 0.28);
      }
      h1 { margin: 0 0 12px; font-size: 34px; }
      p { color: #94a3b8; line-height: 1.6; }
      code { color: #93c5fd; }
    </style>
  </head>
  <body>
    <main>
      <h1>WailsPlugSystem demo</h1>
      <p>
        Это базовое Wails-приложение. Оно не содержит IP-функциональности и не добавляет
        кнопку самостоятельно. Интерфейс расширяется плагином из <code>./plugins</code>.
      </p>
    </main>
  </body>
</html>
