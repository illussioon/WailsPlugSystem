<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>WailsPlugSystem Wails 2 Demo</title>
    <style>
      :root { font-family: Inter, ui-sans-serif, system-ui, sans-serif; color-scheme: light dark; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #111827; color: #e5e7eb; }
      main { width: min(680px, calc(100% - 48px)); padding: 42px; border: 1px solid #374151; border-radius: 24px; background: #1f2937; box-shadow: 0 24px 80px rgba(0,0,0,.3); }
      h1 { margin: 0 0 12px; font-size: 34px; }
      p { color: #9ca3af; line-height: 1.6; }
      code { color: #93c5fd; }
    </style>
  </head>
  <body>
    <main>
      <h1>WailsPlugSystem — Wails 2</h1>
      <p>
        Это базовое Wails 2 приложение. Host не содержит IP-функциональности и не создаёт
        кнопку. Plugin runtime загружает расширения из <code>./plugins</code>.
      </p>
    </main>
  </body>
</html>
